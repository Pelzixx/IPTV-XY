name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew --no-daemon testXyDebugUnitTest
      - name: Build debug APK
        env:
          PRESET_SERVERS: ${{ secrets.PRESET_SERVERS }}
          PRESET_EPG: ${{ secrets.PRESET_EPG }}
          PRESET_CONFIG_URL: ${{ secrets.PRESET_CONFIG_URL }}
        run: ./gradlew --no-daemon assembleXyDebug assembleStandardDebug
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-xy-debug
          path: app/build/outputs/apk/*/debug/*.apk