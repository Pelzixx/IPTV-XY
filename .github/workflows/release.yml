# Neue Version veröffentlichen: GitHub > Actions > "Release" > "Run workflow", Versionsnummer eintragen.
# Baut die signierte APK und legt im ÖFFENTLICHEN Repo Pelzixx/IPTV-XY-Releases ein Release mit
# iptv-xy.apk und update.json an (der Code selbst liegt im privaten Repo; Downloads aus privaten Repos
# gehen nur mit Anmeldung). Im Code-Repo wird nur der Tag vX.Y gesetzt.
# Die App sucht ihre Updates unter .../IPTV-XY-Releases/releases/latest/download/update.json,
# der Downloader-Code zeigt auf .../IPTV-XY-Releases/releases/latest/download/iptv-xy.apk.
# Secret RELEASES_TOKEN: fein granularer Token mit "Contents: Read and write" nur für IPTV-XY-Releases.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer, z. B. 1.1"
        required: true
      notes:
        description: "Was ist neu? (wird in der App beim Update angezeigt)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ inputs.version }}
      RELEASES_REPO: Pelzixx/IPTV-XY-Releases
      KEYSTORE_FILE: ${{ github.workspace }}/release.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      # Fest eingebaute Server und EPG-Quellen (optional), siehe Presets.kt
      PRESET_SERVERS: ${{ secrets.PRESET_SERVERS }}
      PRESET_EPG: ${{ secrets.PRESET_EPG }}
      PRESET_CONFIG_URL: ${{ secrets.PRESET_CONFIG_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Versionsnummer prüfen
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret RELEASES_TOKEN fehlt (Token mit Schreibrecht auf $RELEASES_REPO)"; exit 1
          fi
          # versionCode muss bei jeder Version steigen: 100 + laufende Nummer dieses Workflows
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Versionsnummer bitte im Format 1.1 oder 1.1.0 angeben"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "v$VERSION_NAME" >/dev/null || gh release view "v$VERSION_NAME" -R "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "::error::Version v$VERSION_NAME gibt es schon"; exit 1
          fi

      - name: Signaturschlüssel einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_BASE64 und KEYSTORE_PASSWORD fehlen (Settings > Secrets and variables > Actions)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Unit-Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Release-APK bauen
        run: ./gradlew --no-daemon assembleRelease

      - name: Signatur prüfen und Dateien vorbereiten
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Signierte APK fehlt"; ls -R app/build/outputs/apk; exit 1; }
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$APK" | grep -i 'SHA-256'
          mkdir -p dist
          cp "$APK" dist/iptv-xy.apk
          jq -n --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" --arg notes "$NOTES" \
            '{versionCode: $code, versionName: $name, apk: "iptv-xy.apk", notes: $notes}' > dist/update.json
          cat dist/update.json

      - name: GitHub-Release im öffentlichen Repo anlegen
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "v$VERSION_NAME" dist/iptv-xy.apk dist/update.json \
            -R "$RELEASES_REPO" --title "IPTV-XY $VERSION_NAME" \
            --notes "${NOTES:-Neue Version $VERSION_NAME}"

      - name: Tag im Code-Repo setzen
        run: |
          git tag "v$VERSION_NAME" "$GITHUB_SHA"
          git push origin "v$VERSION_NAME"

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$KEYSTORE_FILE"
